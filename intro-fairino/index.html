<!doctype html>
<!-- data-target: a dónde lleva la intro al terminar (cámbialo aquí; p. ej. "/" si la intro vive dentro de fairino.es). -->
<html lang="es" data-target="https://fairino.es/">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FAIRINO España</title>
    <meta name="description" content="FAIRINO España · Robots colaborativos." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://fairino.es/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Si la intro ya se vio en esta sesión, directo a la web (antes de pintar nada). ?intro=1 la fuerza. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (!q.has('intro') && sessionStorage.getItem('fairino-intro-vista') === '1') {
            document.documentElement.className += ' is-skipping';
            location.replace(document.documentElement.dataset.target || 'https://fairino.es/');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Inter (Google Fonts, licencia OFL) servida desde la propia web: más rápida y sin enviar datos a terceros. -->
    <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/intro.css" />
  </head>

  <body>
    <main class="intro" data-intro>
      <!-- Escena 2: el vídeo espera detrás, en negro. -->
      <div class="film" data-film aria-hidden="true">
        <video data-video muted playsinline preload="auto" disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>

      <!-- Escena 1: chispas, resplandor y el nombre. -->
      <canvas class="sparks" data-sparks aria-hidden="true"></canvas>
      <div class="underglow" data-underglow aria-hidden="true"></div>

      <h1 class="word" data-word aria-label="fairino.es">
        <span class="word-base" data-word-base aria-hidden="true"><span class="ch">f</span><span class="ch">a</span><span class="ch">i</span><span class="ch">r</span><span class="ch">i</span><span class="ch">n</span><span class="ch" data-o>o</span><span class="ch">.</span><span class="ch">e</span><span class="ch">s</span><i class="baseline" data-baseline></i></span>
        <span class="word-heat" aria-hidden="true">fairino.es</span>
        <span class="word-shine" aria-hidden="true">fairino.es</span>
      </h1>

      <p class="hint" data-hint><span>Haz clic para entrar</span></p>

      <button class="enter" type="button" data-enter aria-label="Entrar en fairino.es"></button>
      <a class="skip" href="https://fairino.es/" data-skip>Saltar intro</a>

      <div class="grain" aria-hidden="true"></div>
      <div class="whiteout" data-whiteout aria-hidden="true">
        <a class="whiteout-link" href="https://fairino.es/" data-whiteout-link>Entrar en fairino.es</a>
      </div>
    </main>

    <noscript>
      <style>.intro{cursor:default}.hint,.enter,.sparks,.underglow,.film{display:none}.word{opacity:1;filter:none}</style>
      <p class="noscript"><a href="https://fairino.es/">Entrar en fairino.es</a></p>
    </noscript>

    <script src="js/vendor/gsap.min.js" defer></script>
    <script src="js/sparks.js" defer></script>
    <script src="js/intro.js" defer></script>
  </body>
</html>
