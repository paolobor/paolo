# Publica la web en GitHub Pages (rama gh-pages) cada vez que se sube algo a main.
# Solo se ejecuta en el repositorio de la web, nunca en copias o forks.
#
# Primera vez: Settings → Pages → Build and deployment → Source: "Deploy from a branch" → gh-pages / (root).
# Dominio propio (cuando toque): variables del repositorio SITE_URL=https://fairino.es y BASE_PATH=/,
# y CNAME=fairino.es (Settings → Secrets and variables → Actions → Variables).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'paolobor/fairino-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build
        env:
          SITE: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ${{ vars.CNAME }}
          commit_message: 'Publicar ${{ github.sha }}'
