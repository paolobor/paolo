# Publica la web en GitHub Pages.
# Requisito: Settings → Pages → Source: "GitHub Actions".
# Variables opcionales del repositorio (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL  p. ej. https://fairino.es          (por defecto https://<usuario>.github.io)
#   BASE_PATH p. ej. /                            (por defecto /<repositorio>/)
name: Desplegar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
